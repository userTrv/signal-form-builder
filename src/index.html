<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signal Form Builder</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dynamic form engine and visual form builder on Angular Signal Forms.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    try { var t = localStorage.getItem('sfb.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <sfb-root></sfb-root>
  <noscript>This demo needs JavaScript.</noscript>
</body>
</html>
